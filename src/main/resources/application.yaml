spring:
  webflux:
    problemdetails:
      enabled: true
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: StripPrefix
              args:
                parts: 1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5 
                redis-rate-limiter.burstCapacity: 10 
                redis-rate-limiter.requestedTokens: 1 
                key-resolver: "#{@ipKeyResolver}" 

        - id: user-service-internal-block
          uri: no://op 
          predicates:
            - Path=/api/users/internal/**
          filters:
            - SetStatus=403 

        - id: user-service-cards
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/cards/**
          filters:
            - name: StripPrefix
              args:
                parts: 1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: user-service-restore
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/*/restore
            - Method=POST
          filters:
            - name: StripPrefix
              args:
                parts: 1

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
            - Method=GET,PUT,PATCH,HEAD,OPTIONS
          filters:
            - name: StripPrefix
              args:
                parts: 1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
          filters:
            - name: StripPrefix
              args:
                parts: 1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: StripPrefix
              args:
                parts: 1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

server:
  port: ${GATEWAY_PORT:8080}

app:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    user-url: ${USER_SERVICE_URL:http://localhost:8082}
    order-url: ${ORDER_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktY2hhbmdlLWl0}
    issuer: ${JWT_ISSUER:auth-service}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:PT15M}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:P7D}
    blacklist-key-prefix: ${JWT_BLACKLIST_KEY_PREFIX:auth:jwt:blacklist:}
  idempotency:
    routes:
      - method: POST
        path-prefix: /api/users
      - method: DELETE
        path-prefix: /api/users
  security:
    auth-service-path-prefix: /api/auth/
    whitelist-paths:
      POST:
        - /api/auth/login
        - /api/auth/register
        - /api/auth/refresh
        - /api/users
      GET:
        - /actuator/health

resilience4j:
  circuitbreaker:
    instances:
      authService: &default-cb
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException.BadRequest
        recordExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
          - io.netty.handler.timeout.ReadTimeoutException
      userService: *default-cb
      orderService: *default-cb

  retry:
    instances:
      authService: &default-retry
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException.GatewayTimeout
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
          - io.netty.handler.timeout.ReadTimeoutException
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.reactive.function.client.WebClientResponseException.NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException.BadRequest
      userService: *default-retry
      orderService: *default-retry

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
