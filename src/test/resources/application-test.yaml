# Профиль интеграционных тестов
spring:
  webflux:
    problemdetails:
      enabled: true
  main:
    banner-mode: "off"

app:
  idempotency:
    routes:
      - method: POST
        path-prefix: /api/users
      - method: DELETE
        path-prefix: /api/users
  security:
    auth-service-path-prefix: /api/auth/
    whitelist-paths:
      POST:
        - /api/auth/login
        - /api/auth/register
        - /api/auth/refresh
        - /api/users
      GET:
        - /actuator/health
  jwt:
    secret: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktY2hhbmdlLWl0"
    issuer: "auth-service"

resilience4j:
  retry:
    instances:
      authService:
        maxAttempts: 1
      userService:
        maxAttempts: 1
      orderService:
        maxAttempts: 1
